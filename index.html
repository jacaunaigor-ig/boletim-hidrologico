<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Hidrológico do Amazonas — CEMOA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg-main: #f4f6f8;
  --header-bg: #ffffff;
  --header-color: #0b2545;
  --panel-bg: #ffffff;
  --text-color: #1e293b;
  --border-color: #e2e8f0;
  --kpi-bg: #ffffff;
  --item-hover: #f8fafc;
  --cell-bg: #f8fafc;
  --primary-accent: #0284c7;
}

[data-theme="dark"] {
  --bg-main: #0f172a;
  --header-bg: #1e293b;
  --header-color: #f8fafc;
  --panel-bg: #1e293b;
  --text-color: #f8fafc;
  --border-color: #334155;
  --kpi-bg: #1e293b;
  --item-hover: #334155;
  --cell-bg: #0f172a;
  --primary-accent: #38bdf8;
}

*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg-main);color:var(--text-color);transition:background .3s,color .3s}

header{background:var(--header-bg);color:var(--header-color);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color)}
.header-title{display:flex;align-items:center;gap:10px}
.header-icon{background:#0284c7;color:#fff;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:18px}
h1{font-size:16px;margin:0;color:var(--header-color);font-weight:700}
header small{font-size:11px;opacity:.7;display:block;margin-top:2px}

.header-actions{display:flex;gap:8px;align-items:center}
.btn-top{background:var(--panel-bg);border:1px solid var(--border-color);color:var(--text-color);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;box-shadow:0 1px 2px rgba(0,0,0,0.05)}
.btn-top:hover{background:var(--item-hover)}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px 20px;background:var(--bg-main)}
.kpi{padding:10px 14px;border:1px solid var(--border-color);border-radius:8px;background:var(--kpi-bg);box-shadow:0 1px 2px rgba(0,0,0,0.02)}
.kpi small{display:block;font-size:10px;color:var(--text-color);text-transform:uppercase;opacity:.6;font-weight:700;letter-spacing:0.5px}
.kpi b{font-size:20px;display:block;margin-top:4px;color:var(--text-color)}
.kpi.clickable{cursor:pointer;transition:transform .1s}.kpi.clickable:hover{transform:translateY(-1px);border-color:var(--primary-accent)}

/* Mobile/Desktop Layout Switcher Tab Bar */
.view-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-bg);border-bottom:1px solid var(--border-color);font-weight:600;font-size:13px;text-align:center}
.tab-btn{padding:12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--text-color);opacity:.6}
.tab-btn.active{border-bottom-color:#0284c7;color:#0284c7;opacity:1}

.main-container{display:grid;grid-template-columns:420px 1fr;height:calc(100vh - 165px);transition:all .3s}
.main-container.hide-list{grid-template-columns:0fr 1fr}
.pane-left{background:var(--panel-bg);border-right:1px solid var(--border-color);display:flex;flex-direction:column;overflow:hidden;transition:all .3s ease;white-space:nowrap}
.main-container.hide-list .pane-left{border-right:none;opacity:0;visibility:hidden;padding:0}

.controls{padding:12px;border-bottom:1px solid var(--border-color)}
.search-box{position:relative;margin-bottom:8px}
.search-box input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border-color);border-radius:6px;background:var(--panel-bg);color:var(--text-color);font-size:12px}
.search-box::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:11px;opacity:0.5}

.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;padding:8px;border:1px solid var(--border-color);border-radius:6px;background:var(--panel-bg);color:var(--text-color);font-size:12px}

.meta-count{padding:6px 12px;font-size:11px;opacity:.6;border-bottom:1px solid var(--border-color);background:var(--cell-bg)}

.list{overflow-y:auto;flex:1}
.item{padding:12px;border-bottom:1px solid var(--border-color);display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;cursor:pointer}
.item:hover{background:var(--item-hover)}
.item-info b{font-size:13px;display:block;margin-bottom:2px}
.item-info small{font-size:11px;opacity:.6}
.status-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-top:6px;text-transform:uppercase}
.badge-alto{background:#ffedd5;color:#c2410c}
.badge-moderado{background:#fef9c3;color:#a16207}
.badge-fraco{background:#dcfce7;color:#166534}

.item-metric{text-align:right}
.metric-value{font-size:14px;font-weight:700}
.metric-sub{font-size:10px;opacity:.6;margin-bottom:2px}
.item-mini-chart{height:25px;width:110px;margin-top:4px}

#map{height:100%;width:100%}

.note{padding:8px 12px;border-top:1px solid var(--border-color);background:var(--note-bg);font-size:10px;opacity:.6}

/* Custom Map Legend Control */
.map-legend {
  background: var(--panel-bg);
  color: var(--text-color);
  padding: 10px 14px;
  font-size: 11px;
  line-height: 1.4;
  box-shadow: 0 1px 5px rgba(0,0,0,0.2);
  border-radius: 6px;
  border: 1px solid var(--border-color);
}
.map-legend h4 { margin: 0 0 4px; font-size: 12px; font-weight: 700; }
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.legend-color { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

/* Popup Map Custom */
.popup-content{min-width:200px}
.popup-content h3{margin:0 0 6px;font-size:13px;color:#0284c7}
.popup-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:8px}
.popup-cell{background:var(--cell-bg);padding:4px;border-radius:4px;font-size:10px}

@media(max-width:900px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .main-container{grid-template-columns:1fr; height:calc(100vh - 210px)}
  .main-container.hide-list{grid-template-columns:1fr}
  .pane-right{display:none}
  .pane-right.mobile-active{display:block}
  .pane-left.mobile-hidden{display:none}
}
@media(min-width:901px){
  .view-tabs{display:none}
}
</style>
</head>
<body onload="init()">

  <div class="header-title">
    <div class="header-icon">🌊</div>

      <h1>Boletim Hidrológico do Amazonas</h1>

  {"calha":"Baixo Solimões","municipio":"MANACAPURU","ana":"14100000","cotas":[18.99,18.95,18.9,18.84,18.76],"cota":18.76,"variacao":-0.08,"tendencia":"BAIXANDO","status":"Fraco","lat":-3.29972,"lng":-60.62056},
  {"calha":"Negro","municipio":"MANAUS","ana":"14990000","cotas":[28.25,28.2,28.15,28.1,28.04],"cota":28.04,"variacao":-0.06,"tendencia":"BAIXANDO","status":"Fraco","lat":-3.11866,"lng":-60.0212},
  {"calha":"Madeira","municipio":"MANICORÉ","ana":"15700000","cotas":[18.84,18.62,18.43,18.34,18.29],"cota":18.29,"variacao":-0.05,"tendencia":"BAIXANDO","status":"Fraco","lat":-5.813035,"lng":-61.299702},

  {"calha":"Purus","municipio":"PAUINI","ana":"13750000","cotas":[null,null,null,null,null],"cota":null,"variacao":null,"tendencia":"VAZANTE","status":"Alto","lat":-7.71638,"lng":-67.002502},
  {"calha":"Alto Negro","municipio":"SÃO GABRIEL DA CACHOEIRA","ana":"14200000","cotas":[8.72,8.70,8.68,8.66,8.64],"cota":8.64,"variacao":-0.02,"tendencia":"BAIXANDO","status":"Moderado","lat":0.1303,"lng":-67.0892},
  {"calha":"Alto Solimões","municipio":"SÃO PAULO DE OLIVENÇA","ana":"11400000","cotas":[10.59,10.45,10.2,9.93,9.65],"cota":9.65,"variacao":-0.28,"tendencia":"BAIXANDO","status":"Alto","lat":-3.463116,"lng":-68.957565},
  {"calha":"Alto Solimões","municipio":"TABATINGA","ana":"10100000","cotas":[4.77,4.76,4.73,4.7,4.68],"cota":4.68,"variacao":-0.02,"tendencia":"BAIXANDO","status":"Alto","lat":-4.2416,"lng":-69.9383}
];

const dias=["13/08","14/08","15/08","16/08","17/08"];
const map=L.map("map").setView([-4.5,-63],6);

let tileLayer=L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  maxZoom:18,
  attribution:'&copy; OpenStreetMap & CARTO'
}).addTo(map);

let markers=[];
let activeModalChart=null;

// Legenda dinâmica no mapa
const legend=L.control({position: 'bottomright'});
legend.onAdd = function (map) {
  const div = L.DomUtil.create('div', 'map-legend');
  div.id = 'mapLegendContent';
  return div;
};
legend.addTo(map);

function updateLegend() {
  const tipo = document.getElementById("filtro-tipo").value;
  const div = document.getElementById("mapLegendContent");
  if(!div) return;
  
  const title = tipo === 'enchente' ? 'Status de Risco - Enchente' : 'Status de Risco - Vazante';
  
  div.innerHTML = `
    <h4>${title}</h4>
    <div class="legend-item"><span class="legend-color" style="background:#f97316"></span> Alto</div>
    <div class="legend-item"><span class="legend-color" style="background:#eab308"></span> Moderado</div>
    <div class="legend-item"><span class="legend-color" style="background:#22c55e"></span> Fraco</div>
  `;
}

function init(){
  updateLegend();
  render();
}

function updateKPIs() {
  const totalMun = dados.length;
  const comCota = dados.filter(e => e.cota !== null).length;
  const semCota = totalMun - comCota;
  
  // Contagens por status baseadas no total atualizado
  const normal = dados.filter(e => e.status === "Fraco").length;
  const atencao = dados.filter(e => e.status === "Moderado").length;
  const alerta = dados.filter(e => e.status === "Alto").length;

  const kpisContainer = document.getElementById("kpisContainer");
  kpisContainer.innerHTML = `
    <div class="kpi"><small>Municípios</small><b>${totalMun}</b></div>
    <div class="kpi"><small>Normal</small><b style="color:#166534">${normal}</b></div>
    <div class="kpi"><small>Atenção</small><b style="color:#a16207">${atencao}</b></div>
    <div class="kpi"><small>Alerta</small><b style="color:#c2410c">${alerta}</b></div>
    <div class="kpi"><small>Cotas em 17/08</small><b>${comCota}</b></div>
    <div class="kpi clickable" onclick="filterSL()" title="Filtrar Sem Leitura"><small>Sem Leitura</small><b style="color:#a16207">${semCota}</b></div>
  `;
}

function badgeClass(st){
  if(st==="Alto") return "badge-alto";
  if(st==="Moderado") return "badge-moderado";
  return "badge-fraco";
}

function colorStatus(st){
  if(st==="Alto") return "#f97316";     // Laranja
  if(st==="Moderado") return "#eab308"; // Amarelo
  return "#22c55e";                     // Verde
}

function render(){
  updateKPIs();
  const calha=document.getElementById("calha").value;
  const busca=document.getElementById("busca").value.toLowerCase().trim();
  
  const filtrados=dados.filter(e=>{
    const matchCalha=calha==="Todas" || e.calha===calha;
    const matchBusca=!busca || e.municipio.toLowerCase().includes(busca) || e.ana.toLowerCase().includes(busca);
    return matchCalha && matchBusca;
  });

  document.getElementById("metaCount").innerText = `${filtrados.length} de ${dados.length} municípios · série 13/08-17/08`;

  const container=document.getElementById("listContainer");
  container.innerHTML="";

  if(filtrados.length===0){
    container.innerHTML=`<div style="padding:20px;text-align:center;font-size:12px;opacity:.6;">Nenhum município encontrado.</div>`;
    return;
  }

  markers.forEach(m=>map.removeLayer(m));
  markers=[];

  filtrados.forEach((e,idx)=>{
    const div=document.createElement("div");
    div.className="item";
    const miniId=`mini_${idx}`;
    const hasData = e.cota !== null;

    div.innerHTML=`
      <div class="item-info">
        <b>${e.municipio}</b>
        <small>${e.calha} · ANA ${e.ana}</small><br>
        <span class="status-badge ${badgeClass(e.status)}">${e.status}</span>
      </div>
      <div class="item-metric">
        <div class="metric-value">${hasData ? e.cota.toFixed(2) + " m" : "SL"}</div>
        <div class="metric-sub">${hasData && e.variacao !== null ? (e.variacao>=0?"+":"") + e.variacao.toFixed(2)+" m" : "sem leitura"}</div>
        <div class="item-mini-chart"><canvas id="${miniId}"></canvas></div>
      </div>
    `;

    div.onclick=()=>{
      if(e.lat!=null && e.lng!=null){
        if(window.innerWidth <= 900) switchView('mapa');
        map.setView([e.lat, e.lng], 9);
        markers.forEach(m=>{
          if(m.getLatLng().lat===e.lat && m.getLatLng().lng===e.lng) m.openPopup();
        });
      }
    };

    container.appendChild(div);

    // Mini Chart render
    setTimeout(()=>{
      const cv=document.getElementById(miniId);
      if(cv){
        new Chart(cv,{
          type:"line",
          data:{
            labels:dias,
            datasets:[{
              data:e.cotas,
              borderWidth:1.5,
              pointRadius:0,
              borderColor:colorStatus(e.status),
              tension:0.2,
              spanGaps:false
            }]
          },
          options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{legend:{display:false}},
            scales:{x:{display:false},y:{display:false}}
          }
        });
      }
    },0);

    // Map Marker com raio otimizado
    if(e.lat!=null && e.lng!=null){
      const m=L.circleMarker([e.lat,e.lng],{
        radius:4.5,
        color:"transparent",
        weight:0,
        fillColor:colorStatus(e.status),
        fillOpacity:0.95
      });

      const popupId=`popup_chart_${idx}`;
      const popupHtml=`
        <div class="popup-content">
          <h3>📍 ${e.municipio}</h3>
          <div class="popup-grid">
            <div class="popup-cell"><b>Cota:</b> ${hasData?e.cota.toFixed(2)+"m":"SL"}</div>
            <div class="popup-cell"><b>Tend:</b> ${e.tendencia}</div>
          </div>
          <div style="height:90px"><canvas id="${popupId}"></canvas></div>
        </div>
      `;

      m.bindPopup(popupHtml,{maxWidth:240});
      m.on("popupopen",()=>{
        const cvPopup=document.getElementById(popupId);
        if(!cvPopup)return;
        if(activeModalChart)activeModalChart.destroy();
        activeModalChart=new Chart(cvPopup,{
          type:"line",
          data:{labels:dias,datasets:[{data:e.cotas,borderWidth:2,pointRadius:2,borderColor:colorStatus(e.status),tension:0.2}]},
          options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:8}}},y:{ticks:{font:{size:8}}}}}
        });
      });

      m.addTo(map);
      markers.push(m);
    }
  });
}

function switchView(view){
  const tabL=document.getElementById("tabLista");
  const tabM=document.getElementById("tabMapa");
  const paneL=document.getElementById("paneLeft");
  const paneR=document.getElementById("paneRight");

  if(view==='lista'){
    tabL.classList.add("active");
    tabM.classList.remove("active");
    paneL.classList.remove("mobile-hidden");
    paneR.classList.remove("mobile-active");
  }else{
    tabM.classList.add("active");
    tabL.classList.remove("active");
    paneL.classList.add("mobile-hidden");
    paneR.classList.add("mobile-active");
    setTimeout(()=>map.invalidateSize(),200);
  }
}

function toggleListPanel(){
  const container = document.getElementById("mainLayout");
  const btn = document.getElementById("btnToggleList");
  container.classList.toggle("hide-list");
  
  const isHidden = container.classList.contains("hide-list");
  btn.innerText = isHidden ? "📂 Mostrar Lista" : "🗺️ Mostrar Mapa";
  setTimeout(()=>map.invalidateSize(), 300);
}

function filterSL(){
  const busca=document.getElementById("busca");
  busca.value=busca.value===""?"SL":"";
  render();
}

function toggleTheme(){
  const body=document.body;
  const isDark=body.getAttribute("data-theme")==="dark";
  map.removeLayer(tileLayer);
  if(isDark){
    body.removeAttribute("data-theme");
    tileLayer=L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:18}).addTo(map);
  }else{
    body.setAttribute("data-theme","dark");
    tileLayer=L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:18}).zIndex(1).addTo(map);
  }
}

function exportCSV(){
  let csv="Municipio;Calha;ANA;Cota(m);Tendencia;Status\n";
  dados.forEach(e=>{
    csv+=`"${e.municipio}";"${e.calha}";"${e.ana}";"${e.cota!==null?e.cota:'SL'}";"${e.tendencia}";"${e.status}"\n`;
  });
  const blob=new Blob(["\uFEFF"+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`boletim_hidrologico_cemoa.csv`;
  a.click();
}
</script>
</body>
