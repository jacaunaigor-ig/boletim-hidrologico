#map{height:100%;min-height:450px}
.popup{min-width:210px;max-width:240px}
.popup h3{margin:0 0 5px;font-size:13px;color:#d97706}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.cell{background:#f4f7f8;padding:4px 6px;border-radius:3px;font-size:9px;color:#0b2545}
.chart{height:110px;margin-top:5px}
.note{padding:7px 9px;border-top:1px solid #ddd;background:#fafafa;font-size:9px;color:#0b2545}
.legend{background:#fff;padding:8px 10px;border-radius:5px;box-shadow:0 1px 5px #888;font-size:11px;line-height:18px;color:#0b2545}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}

  {"calha":"Purus","municipio":"TAPAUÁ","ana":"DCAM","cotas":[null,null,null,null,null],"cota":null,"variacao":null,"tendencia":"VAZANTE","status":"ATENÇÃO","status_enchente":"ATENÇÃO","status_vazante":"NORMAL","lat":-5.627966,"lng":-63.187866},

  {"calha":"Médio Solimões","municipio":"UARINI","ana":"DCAM","cotas":[null,null,null,null,null],"cota":null,"variacao":null,"tendencia":"VAZANTE","status":"NORMAL","status_enchente":"NORMAL","status_vazante":"NORMAL","lat":-2.99609,"lng":-65.1133},

  {"calha":"Médio Amazonas","municipio":"URUCURITUBA","ana":"—","cotas":[null,null,null,null,null],"cota":null,"variacao":null,"tendencia":"VAZANTE","status":"NORMAL","status_enchente":"NORMAL","status_vazante":"NORMAL","lat":-3.12841,"lng":-58.1496}
];

const dias=["13/08","14/08","15/08","16/08","17/08"];
const map=L.map("map").setView([-4.5,-63],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap contributors"}).addTo(map);

let markers=[],chartAtual=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function cor(s){return s==="ALERTA"?"#f97316":s==="ATENÇÃO"?"#eab308":"#2e8b57"}
function pill(s){return s==="ALERTA"?"p-alerta":s==="ATENÇÃO"?"p-atencao":s==="NORMAL"?"p-normal":"p-none"}

function getStatusAtivo(e){
 const tipo=document.getElementById("filtro-tipo").value;
 if(tipo==="vazante") return e.status_vazante || "NORMAL";
 if(tipo==="enchente") return e.status_enchente || "NORMAL";
 return e.status || "NORMAL";
}

function popup(e){
 const id="c"+Math.random().toString(36).slice(2);
 const d=e.variacao;
 return `<div class="popup"><h3>📍 ${esc(e.municipio)}</h3>
 <div class="grid">
 <div class="cell"><b>Cota:</b> ${e.cota!=null?e.cota.toFixed(2)+" m":"SL"}</div>
 <div class="cell"><b>Var 24h:</b> ${d!=null?(d>=0?"+":"")+d.toFixed(2)+" m":"SL"}</div>
 <div class="cell"><b>Tend:</b> ${esc(e.tendencia)}</div>
 <div class="cell"><b>Vazante:</b> ${esc(e.status_vazante)}</div>
 <div class="cell"><b>Enchente:</b> ${esc(e.status_enchente)}</div>
 <div class="cell"><b>ANA:</b> ${esc(e.ana)}</div>
 </div><div class="chart"><canvas id="${id}"></canvas></div></div>`;
}

function addMarkers(){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 dados.forEach(e=>{
  if(e.lat==null||e.lng==null)return;
  const st=getStatusAtivo(e);
  const m=L.circleMarker([e.lat,e.lng],{radius:7,color:"#fff",weight:2,fillColor:cor(st),fillOpacity:.95});
  m.bindPopup(popup(e),{maxWidth:260});
  m.on("popupopen",()=>{
   const cv=m.getPopup().getElement().querySelector("canvas"); if(!cv)return;
   if(chartAtual)chartAtual.destroy();
   chartAtual=new Chart(cv,{type:"line",data:{labels:dias,datasets:[{data:e.cotas,borderWidth:2,pointRadius:2,spanGaps:false,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:8}}},y:{ticks:{font:{size:8}}}}}});
  });m.addTo(map);markers.push(m);
 });
}

function atualizarKPIs(filtrados){
 let norm=0, aten=0, aler=0;
 filtrados.forEach(e=>{
  const st=getStatusAtivo(e);
  if(st==="ALERTA") aler++;
  else if(st==="ATENÇÃO") aten++;
  else norm++;
 });
 document.getElementById("kpi-normal").innerText=norm;
 document.getElementById("kpi-atencao").innerText=aten;
 document.getElementById("kpi-alerta").innerText=aler;
}

function render(){
 const calha=document.getElementById("calha").value,status=document.getElementById("status").value,b=document.getElementById("busca").value.toLowerCase().trim();
 
 const filtrados=dados.filter(e=>{
  const st=getStatusAtivo(e);
  return (calha==="Todas"||e.calha===calha)&&(status==="Todos"||st===status)&&(!b||e.municipio.toLowerCase().includes(b)||e.ana.toLowerCase().includes(b));
 });

 // Priorizar Alerta e Atenção na ordenação da lista
 filtrados.sort((a,b)=>{
  const p={"ALERTA":1,"ATENÇÃO":2,"NORMAL":3};
  const sa=getStatusAtivo(a), sb=getStatusAtivo(b);
  return (p[sa]||3)-(p[sb]||3);
 });

 atualizarKPIs(dados.filter(e=>(calha==="Todas"||e.calha===calha)&&(!b||e.municipio.toLowerCase().includes(b)||e.ana.toLowerCase().includes(b))));

 const list=document.getElementById("list");list.innerHTML="";
 
 const canvasIds = [];
 filtrados.forEach((e, idx)=>{
  const st=getStatusAtivo(e);
  const canvasId = `minichart_${idx}`;
  if(e.cotas.some(v => v !== null)){
    canvasIds.push({id: canvasId, data: e.cotas, color: cor(st)});
  }

  const li=document.createElement("div");li.className="item";
  li.innerHTML=`
    <span><b>${esc(e.municipio)}</b><br><small>${esc(e.calha)} · ANA ${esc(e.ana)}</small><br><span class="pill ${pill(st)}">${esc(st)}</span></span>
    <span style="text-align:right">
      <b>${e.cota!=null?e.cota.toFixed(2)+" m":"SL"}</b>
      <div class="item-mini-chart"><canvas id="${canvasId}"></canvas></div>
    </span>`;
  li.onclick=()=>{
    // Foca diretamente nas coordenadas reais do município clicado sem resetar para fora da região
    if(e.lat!=null && e.lng!=null){
      map.setView([e.lat, e.lng], 8);
      const m=markers.find(x=>Math.abs(x.getLatLng().lat-e.lat)<1e-8&&Math.abs(x.getLatLng().lng-e.lng)<1e-8);
      if(m)m.openPopup();
    }
  };
  list.appendChild(li);
 });

 addMarkers();

 // Renderizar mini-gráficos na lista lateral após inserir os elementos no DOM
 setTimeout(()=>{
   canvasIds.forEach(item=>{
     const el = document.getElementById(item.id);
     if(el){
       new Chart(el, {
         type: 'line',
         data: {
           labels: ['', '', '', '', ''],
           datasets: [{
             data: item.data,
             borderColor: item.color,
             borderWidth: 1.5,
             pointRadius: 0,
             spanGaps: true,
             tension: 0.2
           }]
         },
         options: {
           responsive: true,
           maintainAspectRatio: false,
           plugins: { legend: { display: false }, tooltip: { enabled: false } },
           scales: { x: { display: false }, y: { display: false } }
         }
       });
     }
   });
 }, 50);
}

const legend=L.control({position:"topright"});
legend.onAdd=()=>{
 const d=L.DomUtil.create("div","legend");
 const tipo=document.getElementById("filtro-tipo").value;
 const titulo = tipo==="vazante"?"Status de Vazante":tipo==="enchente"?"Status de Enchente":"Status Geral";
 d.innerHTML=`<b>${titulo}</b><br><span class="dot" style="background:#2e8b57"></span>Normal<br><span class="dot" style="background:#eab308"></span>Atenção<br><span class="dot" style="background:#f97316"></span>Alerta`;
 return d;
};
legend.addTo(map);

document.getElementById("filtro-tipo").addEventListener("change",()=>{
 map.removeControl(legend);
 legend.addTo(map);
});

render();setTimeout(()=>map.invalidateSize(),300);
</script>
</body>
</html>
