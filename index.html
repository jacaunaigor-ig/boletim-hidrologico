<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Boletim Hidrológico AM — CEMOA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">

    <!-- CSS externo -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
    <div class="header-brand">
        <div class="header-icon">🌊</div>
        <div class="header-info">
            <h1>Boletim <span class="badge">CEMOA</span></h1>
            <small>17/08/2026 · <span id="hora-atualizacao">--:--</span></small>
        </div>
    </div>
    <div class="header-actions">
        <button class="btn-icon sync" onclick="forcarAtualizacao()" title="Atualizar dados">
            <span>🔄</span>
        </button>
        <button class="btn-icon" onclick="alternarTema()">
            <span id="theme-icon">🌙</span>
        </button>
    </div>
</header>

<!-- ===== KPIS ===== -->
<section class="kpis">
    <div class="kpi"><small>Municípios</small><b>62</b></div>
    <div class="kpi"><small>Baixo</small><b id="kpi-normal">0</b></div>
    <div class="kpi"><small>Moderado</small><b id="kpi-moderado">0</b></div>
    <div class="kpi"><small>Alto</small><b id="kpi-alto">0</b></div>
    <div class="kpi"><small>Cotas</small><b id="kpi-com-cota">0</b></div>
    <div class="kpi clickable" onclick="filtrarSL()" title="Clique para filtrar SL">
        <small>Sem Leitura</small>
        <b id="kpi-sl" style="color:var(--accent-color)">0</b>
    </div>
</section>

<!-- ===== LAYOUT PRINCIPAL ===== -->
<div class="layout" id="layoutMain">
    <aside id="panelAside">
        <div class="controls">
            <button class="btn-toggle-list" onclick="alternarVisibilidadeLista()">
                <span id="btn-icon">🗺️</span>
                <span id="btn-text">Ver Mapa</span>
            </button>

            <button class="btn-geo" onclick="encontrarMaisProximo()">
                📍 <span>Estação Próxima</span>
            </button>

            <div class="chips-container">
                <button class="chip active" onclick="filtrarPorChip('Todos', this)">📋 Todos</button>
                <button class="chip" onclick="filtrarPorChip('ALTO', this)">🚨 Alto</button>
                <button class="chip" onclick="filtrarPorChip('MODERADO', this)">⚠️ Moderado</button>
                <button class="chip" onclick="filtrarPorChip('SL', this)">📊 SL</button>
            </div>

            <div class="export-bar">
                <button class="btn-export" onclick="exportarCSV()">📥 CSV</button>
                <button class="btn-export" onclick="gerarRelatorioPrint()">🖨️ PDF</button>
            </div>

            <select id="filtro-tipo" onchange="render()">
                <option value="vazante">🌊 Vazante</option>
                <option value="enchente">🌊 Enchente</option>
                <option value="geral">📊 Geral</option>
            </select>

            <select id="calha" onchange="render()">
                <option value="Todas">🗺️ Todas</option>
                <option>Alto Solimões</option>
                <option>Baixo Amazonas</option>
                <option>Baixo Solimões</option>
                <option>Juruá</option>
                <option>Madeira</option>
                <option>Médio Amazonas</option>
                <option>Médio Solimões</option>
                <option>Negro</option>
                <option>Purus</option>
            </select>

            <select id="status" style="display:none;" onchange="render()">
                <option value="Todos">Todos</option>
                <option value="NORMAL">🟢 Baixo</option>
                <option value="MODERADO">🟡 Moderado</option>
                <option value="ALTO">🟠 Alto</option>
                <option value="SL">📊 SL</option>
            </select>

            <input id="busca" placeholder="🔍 Buscar município..." oninput="render()">

            <button class="btn-reset" onclick="limparFiltros()">🧹 Limpar</button>
        </div>

        <div class="print-header">📋 Relatório do Boletim Hidrológico - CEMOA (17/08/2026)</div>
        <div id="list" class="list"></div>
        <div class="note">Fonte: CEMOA MONITORAMENTO</div>
    </aside>

    <main id="map">
        <div class="map-status-card">
            <span class="status-dot"></span>
            <strong>Boletim CEMOA</strong>
            <span>62 municípios</span>
        </div>
    </main>
</div>

<!-- ===== BOTÃO FLUTUANTE (Mobile) ===== -->
<div id="float-toggle">
    <button onclick="alternarVisibilidadeLista()">
        📋 <span>Lista</span>
    </button>
</div>

<!-- ===== MODAL DE GRÁFICO ===== -->
<div id="modalGrafico" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000; justify-content:center; align-items:center;">
    <div class="modal-content">
        <button class="modal-close" onclick="fecharModalGrafico()">✕</button>
        <h3 id="modal-titulo">📈 Histórico</h3>
        <div class="modal-chart-container">
            <canvas id="canvasModalGrafico"></canvas>
        </div>
    </div>
</div>

<!-- ===== SCRIPTS EXTERNOS ===== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

<!-- ===== SCRIPT PRINCIPAL ===== -->
<script src="script.js"></script>

</body>
</html>
